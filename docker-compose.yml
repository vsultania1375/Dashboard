version: '3.8'

services:
  # ── PostgreSQL Database ─────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: sad_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: service_dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/models/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d service_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sad_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dashboard:dashboard123@db:5432/service_dashboard
      JWT_SECRET: please-change-this-secret-key-in-production
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  # ── React Frontend (served via Nginx) ──────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sad_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
